name: Actualizar Picks Fresh

on:
  schedule:
    - cron: "0 2,8,12,16,20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy scipy requests
      - run: python build.py
        env:
          FOOTBALL_DATA_ORG_KEY: ${{ secrets.FOOTBALL_DATA_ORG_KEY }}
      - name: Guardar la página
        run: |
          git config user.name "picks-fresh-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs data/espn_*.csv
          git commit -m "Actualizar datos" || echo "Sin cambios"
          git push
