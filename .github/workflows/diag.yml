name: Diagnóstico de fuentes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python diag.py
      - name: Guardar el resultado
        run: |
          git config user.name "picks-fresh-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/diag.json
          git commit -m "Diagnóstico de fuentes" || echo "Sin cambios"
          git pull --rebase
          git push
