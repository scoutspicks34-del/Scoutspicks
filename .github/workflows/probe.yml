name: Probe fuentes de bajas
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar muestras
        run: |
          mkdir -p probe
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          g(){ n="$1"; u="$2"; code=$(curl -sL -m 40 -A "$UA" -o "probe/$n" -w "%{http_code} %{size_download}" "$u" || echo ERR); echo "$n $u $code" >> probe/log.txt; sleep 2; }
          g sg_ucl.html https://www.sportsgambler.com/injuries/football/uefa-champions-league/
          g sg_mls.html https://www.sportsgambler.com/injuries/football/usa-mls/
          g sg_noruega.html https://www.sportsgambler.com/injuries/football/norway-eliteserien/
          g sg_arabia.html https://www.sportsgambler.com/injuries/football/saudi-arabia-saudi-pro-league/
      - name: Subir a rama probe
        run: |
          git config user.name "picks-fresh-bot"; git config user.email "bot@users.noreply.github.com"
          git checkout -b probe
          git add -f probe
          git commit -m "probe" 
          git push -f origin probe
